<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PAWPAIR ペットホテルAIマッチング基盤</title>
  <desc id="desc">飼い主フォームからFirebase、Cloudflare Worker、OrcaRouter、Firestore、全ペア採点、部屋最適化へ至るアーキテクチャ図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eef5fb"/></linearGradient>
    <linearGradient id="firebase" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8e6"/><stop offset="1" stop-color="#fff0c2"/></linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0eb"/><stop offset="1" stop-color="#ffd9cc"/></linearGradient>
    <linearGradient id="logic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef9f1"/><stop offset="1" stop-color="#d8f0df"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#20354d" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52718f"/></marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e47755"/></marker>
    <style>
      .title{font:700 32px 'Segoe UI',Meiryo,sans-serif;fill:#17324d}.subtitle{font:400 16px 'Segoe UI',Meiryo,sans-serif;fill:#55718b}.section{font:700 17px 'Segoe UI',Meiryo,sans-serif;fill:#24435e}.box-title{font:700 18px 'Segoe UI',Meiryo,sans-serif;fill:#17324d}.box-text{font:400 14px 'Segoe UI',Meiryo,sans-serif;fill:#45637d}.small{font:400 12px 'Segoe UI',Meiryo,sans-serif;fill:#55718b}.badge{font:700 12px 'Segoe UI',Meiryo,sans-serif;fill:#fff;letter-spacing:.5px}.label{font:600 13px 'Segoe UI',Meiryo,sans-serif;fill:#46637c}.arrow-label{font:600 12px 'Segoe UI',Meiryo,sans-serif;fill:#52718f}.note{font:600 13px 'Segoe UI',Meiryo,sans-serif;fill:#9c4e3d}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="72" class="title">PAWPAIR｜ペットホテル AI マッチング基盤</text>
  <text x="80" y="102" class="subtitle">AWSアーキテクチャ図風の説明資料用ビュー｜サンプル入力 + 実サービス処理</text>
  <rect x="1260" y="48" width="250" height="42" rx="21" fill="#365f82"/>
  <text x="1385" y="75" text-anchor="middle" class="badge">単一利用者 / 固定URL</text>

  <!-- left actor -->
  <rect x="70" y="190" width="230" height="640" rx="22" fill="#ffffff" stroke="#b8cce0" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="232" class="section">利用者</text>
  <circle cx="185" cy="320" r="54" fill="#dcecf8"/>
  <circle cx="185" cy="300" r="20" fill="#6f9abb"/>
  <path d="M145 355c5-32 75-32 80 0" fill="#6f9abb"/>
  <text x="185" y="422" text-anchor="middle" class="box-title">飼い主</text>
  <text x="185" y="448" text-anchor="middle" class="box-text">固定URLフォーム</text>
  <rect x="100" y="520" width="170" height="156" rx="14" fill="#f5f9fc" stroke="#d2e0ec"/>
  <text x="118" y="550" class="box-title" font-size="15">入力するもの</text>
  <text x="118" y="578" class="box-text">・性格 / 遊び方</text>
  <text x="118" y="604" class="box-text">・注意事項</text>
  <text x="118" y="630" class="box-text">・写真 / 動画</text>
  <text x="118" y="660" class="note">名前・連絡先・音声は</text>
  <text x="118" y="680" class="note">AIへ送信しない</text>

  <!-- app boundary -->
  <rect x="350" y="160" width="420" height="700" rx="24" fill="#ffffff" stroke="#9db7ce" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="385" y="204" class="section">Firebase Hosting / React アプリ</text>
  <rect x="390" y="245" width="340" height="94" rx="16" fill="#edf6fd" stroke="#a8c7df"/>
  <text x="415" y="279" class="box-title">OwnerForm</text>
  <text x="415" y="305" class="box-text">入力検証 / Blobプレビュー / 固定URL</text>
  <rect x="390" y="382" width="340" height="118" rx="16" fill="#f5f9fc" stroke="#c5d8e8"/>
  <text x="415" y="417" class="box-title">送信オーケストレーション</text>
  <text x="415" y="443" class="box-text">1. AI解析 → 2. 受付保存</text>
  <text x="415" y="468" class="box-text">3. プロフィール保存・読戻し</text>
  <rect x="390" y="543" width="340" height="164" rx="16" fill="#f5f9fc" stroke="#c5d8e8"/>
  <text x="415" y="578" class="box-title">StaffDashboard</text>
  <text x="415" y="604" class="box-text">全ペア相性マトリクス</text>
  <text x="415" y="630" class="box-text">部屋割り案 / 根拠 / 最終確定</text>
  <text x="415" y="670" class="small">AI失敗時は成功扱いにせず明示エラー</text>

  <!-- cloudflare boundary -->
  <rect x="820" y="160" width="330" height="700" rx="24" fill="url(#worker)" stroke="#e89a7c" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="850" y="204" class="section">Cloudflare Workers Free</text>
  <rect x="855" y="248" width="260" height="120" rx="16" fill="#fffaf7" stroke="#f1b49f"/>
  <text x="880" y="284" class="box-title">pet-hotel-agent-api</text>
  <text x="880" y="311" class="box-text">/api/analyze</text>
  <text x="880" y="337" class="box-text">入力制限 / 応答検証 / CORS</text>
  <rect x="855" y="420" width="260" height="156" rx="16" fill="#fffaf7" stroke="#f1b49f"/>
  <text x="880" y="454" class="box-title">一時メディア処理</text>
  <text x="880" y="481" class="box-text">画像・動画をdata URLで転送</text>
  <text x="880" y="507" class="box-text">解析後は永続保存しない</text>
  <text x="880" y="548" class="note">R2 /api/media は無効化</text>
  <rect x="855" y="630" width="260" height="112" rx="16" fill="#5b3a34"/>
  <text x="880" y="666" class="badge">Worker Secret</text>
  <text x="880" y="697" class="badge">ORCAROUTER_API_KEY</text>
  <text x="880" y="722" class="small" fill="#f6d9cf">暗号化登録 / ブラウザ非公開</text>

  <!-- orca -->
  <rect x="1210" y="160" width="320" height="330" rx="24" fill="#ffffff" stroke="#a8b9ca" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1240" y="204" class="section">外部AI</text>
  <rect x="1250" y="250" width="240" height="130" rx="16" fill="#eaf4ff" stroke="#9dbfdf"/>
  <text x="1370" y="294" text-anchor="middle" class="box-title">OrcaRouter</text>
  <text x="1370" y="324" text-anchor="middle" class="box-text">文章・写真・動画の解析</text>
  <text x="1370" y="350" text-anchor="middle" class="box-text">構造化 personality profile</text>
  <text x="1240" y="430" class="small">送信対象: 性格 / 遊び方 / 注意事項 / 写真 / 動画</text>
  <text x="1240" y="454" class="note">名前・連絡先・音声は送信しない</text>

  <!-- data and logic -->
  <rect x="1210" y="535" width="320" height="325" rx="24" fill="url(#firebase)" stroke="#e0b84c" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1240" y="579" class="section">Firebase Spark / Firestore</text>
  <text x="1240" y="607" class="small">Project: pawpair-ai-hack-2026</text>
  <text x="1240" y="628" class="small">Region: asia-northeast1</text>
  <rect x="1245" y="660" width="250" height="70" rx="12" fill="#fffdf5" stroke="#efd37d"/>
  <text x="1265" y="688" class="box-title" font-size="15">OwnerIntake + AI分析結果</text>
  <text x="1265" y="711" class="small">受付 / 性格パラメータ / 根拠</text>
  <rect x="1245" y="750" width="250" height="70" rx="12" fill="#fffdf5" stroke="#efd37d"/>
  <text x="1265" y="778" class="box-title" font-size="15">PetProfile / MatchingSnapshot</text>
  <text x="1265" y="801" class="small">非PIIプロフィール / 提案・確定</text>

  <rect x="350" y="890" width="1180" height="70" rx="18" fill="url(#logic)" stroke="#91c39f" stroke-width="2"/>
  <text x="390" y="930" class="box-title">決定ロジック</text>
  <text x="555" y="930" class="box-text">全 n(n-1)/2 ペアを先に採点</text>
  <text x="900" y="930" class="box-text">→ ハード制約・定員を満たす部屋割り最適化</text>
  <text x="1320" y="930" class="box-text">→ オペレーター確定</text>

  <!-- arrows -->
  <path d="M300 360 H350" stroke="#52718f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="308" y="345" class="arrow-label">入力</text>
  <path d="M770 350 H820" stroke="#52718f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="778" y="335" class="arrow-label">AI解析payload</text>
  <path d="M1150 300 H1210" stroke="#e47755" stroke-width="3" fill="none" marker-end="url(#arrowAccent)"/>
  <text x="1158" y="285" class="arrow-label">実解析要求</text>
  <path d="M1210 390 H1150" stroke="#52718f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1154" y="410" class="arrow-label">構造化応答</text>
  <path d="M770 455 C930 455 1000 680 1210 690" stroke="#52718f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="900" y="600" class="arrow-label">分析済み受付保存</text>
  <path d="M770 700 C900 700 1030 790 1210 785" stroke="#52718f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="885" y="760" class="arrow-label">プロフィール / 提案保存</text>
  <path d="M540 860 V890" stroke="#52718f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1030 860 V890" stroke="#52718f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text x="80" y="950" class="small">説明資料用｜実配備・実E2Eの確認状況はTASKS.mdを参照</text>
</svg>
