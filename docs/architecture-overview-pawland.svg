<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">PAWLAND システム構成</title>
  <desc id="description">飼い主がWebアプリへ犬の情報を入力し、許可された情報だけがCloudflare Worker経由でOrcaRouterへ送られる。WebアプリはFirestoreへデータを保存し、相性計算と部屋最適化の結果を施設スタッフへ提示する。施設スタッフは当日観測を記録する。</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f3f34" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#3f725f"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#4f7e9e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#bd7c3d"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f3ea"/>
  <circle cx="72" cy="62" r="28" fill="#d9e9df"/>
  <circle cx="112" cy="62" r="17" fill="#efd9bb"/>
  <circle cx="1535" cy="66" r="34" fill="#dceae4"/>

  <text x="800" y="67" text-anchor="middle" font-family="'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="42" font-weight="700" fill="#244c3d">PAWLAND システム構成</text>
  <text x="800" y="105" text-anchor="middle" font-family="'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="20" fill="#60736b">AIが情報を整理し、コードが安全条件を守り、最後は施設スタッフが判断する</text>

  <rect x="255" y="130" width="1090" height="78" rx="20" fill="#ffffff" stroke="#cbd5d0" stroke-width="2"/>
  <rect x="275" y="149" width="118" height="40" rx="20" fill="#e4f0ea"/>
  <text x="334" y="176" text-anchor="middle" font-family="'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="17" font-weight="700" fill="#35624f">AI送信境界</text>
  <text x="420" y="158" font-family="'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#244c3d">送る</text>
  <text x="470" y="158" font-family="'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="16" fill="#384a43">犬の性格・遊び方・注意事項・写真・動画から抽出した静止画</text>
  <text x="420" y="187" font-family="'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#a45f35">送らない</text>
  <text x="500" y="187" font-family="'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="16" fill="#384a43">飼い主の氏名・連絡先・音声・元動画</text>

  <!-- Flow connectors are drawn before the cards so endpoints remain clean. -->
  <path d="M280 340 H350" fill="none" stroke="#3f725f" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M660 340 H740" fill="none" stroke="#4f7e9e" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M1040 340 H1120" fill="none" stroke="#4f7e9e" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M1120 384 H1040" fill="none" stroke="#4f7e9e" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <path d="M505 430 V565" fill="none" stroke="#3f725f" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M660 670 H770" fill="none" stroke="#3f725f" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M1180 670 H1280" fill="none" stroke="#bd7c3d" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <path d="M1415 775 V830 H505 V775" fill="none" stroke="#758b82" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow-green)"/>

  <g font-family="'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="15" font-weight="700">
    <rect x="286" y="291" width="58" height="28" rx="14" fill="#f7f3ea"/>
    <text x="315" y="311" text-anchor="middle" fill="#35624f">入力</text>
    <rect x="660" y="291" width="80" height="28" rx="14" fill="#f7f3ea"/>
    <text x="700" y="311" text-anchor="middle" fill="#4f7086">AI分析</text>
    <rect x="1042" y="291" width="76" height="28" rx="14" fill="#f7f3ea"/>
    <text x="1080" y="311" text-anchor="middle" fill="#4f7086">HTTPS</text>
    <rect x="1050" y="398" width="116" height="28" rx="14" fill="#f7f3ea"/>
    <text x="1108" y="418" text-anchor="middle" fill="#4f7086">分析結果</text>
    <rect x="518" y="483" width="116" height="28" rx="14" fill="#f7f3ea"/>
    <text x="576" y="503" text-anchor="middle" fill="#35624f">保存・読出し</text>
    <rect x="665" y="621" width="100" height="28" rx="14" fill="#f7f3ea"/>
    <text x="715" y="641" text-anchor="middle" fill="#35624f">全頭データ</text>
    <rect x="1184" y="621" width="92" height="28" rx="14" fill="#f7f3ea"/>
    <text x="1230" y="641" text-anchor="middle" fill="#a16534">提案</text>
    <rect x="780" y="806" width="360" height="32" rx="16" fill="#f7f3ea"/>
    <text x="960" y="828" text-anchor="middle" fill="#60736b">当日観測・スタッフの判断を記録</text>
  </g>

  <g filter="url(#shadow)" font-family="'Yu Gothic', 'Noto Sans JP', sans-serif">
    <rect x="50" y="255" width="230" height="175" rx="24" fill="#ffffff" stroke="#8db29d" stroke-width="3"/>
    <rect x="72" y="278" width="80" height="30" rx="15" fill="#e4f0ea"/>
    <text x="112" y="299" text-anchor="middle" font-size="14" font-weight="700" fill="#35624f">INPUT</text>
    <text x="165" y="350" text-anchor="middle" font-size="27" font-weight="700" fill="#253c34">飼い主</text>
    <text x="165" y="385" text-anchor="middle" font-size="16" fill="#65766f">愛犬の情報を登録</text>
    <text x="165" y="410" text-anchor="middle" font-size="14" fill="#65766f">URL / QRコードから入力</text>

    <rect x="350" y="240" width="310" height="190" rx="24" fill="#ffffff" stroke="#8db29d" stroke-width="3"/>
    <rect x="372" y="263" width="96" height="30" rx="15" fill="#e4f0ea"/>
    <text x="420" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#35624f">WEB APP</text>
    <text x="505" y="337" text-anchor="middle" font-size="27" font-weight="700" fill="#253c34">React Webアプリ</text>
    <text x="505" y="374" text-anchor="middle" font-size="16" fill="#65766f">飼い主フォーム / スタッフ画面</text>
    <text x="505" y="400" text-anchor="middle" font-size="14" fill="#65766f">TypeScript・Vite・Firebase Hosting</text>

    <rect x="740" y="240" width="300" height="190" rx="24" fill="#ffffff" stroke="#91b8d1" stroke-width="3"/>
    <rect x="762" y="263" width="98" height="30" rx="15" fill="#e4f0f7"/>
    <text x="811" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#4f7086">GATEWAY</text>
    <text x="890" y="337" text-anchor="middle" font-size="26" font-weight="700" fill="#253c34">Cloudflare Worker</text>
    <text x="890" y="374" text-anchor="middle" font-size="16" fill="#65766f">APIキーをSecretで保護</text>
    <text x="890" y="400" text-anchor="middle" font-size="14" fill="#65766f">送信項目・形式を検証</text>

    <rect x="1120" y="240" width="300" height="190" rx="24" fill="#ffffff" stroke="#91b8d1" stroke-width="3"/>
    <rect x="1142" y="263" width="70" height="30" rx="15" fill="#e4f0f7"/>
    <text x="1177" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#4f7086">AI</text>
    <text x="1270" y="337" text-anchor="middle" font-size="29" font-weight="700" fill="#253c34">OrcaRouter</text>
    <text x="1270" y="374" text-anchor="middle" font-size="16" fill="#65766f">性格・遊び方・注意点を整理</text>
    <text x="1270" y="400" text-anchor="middle" font-size="14" fill="#65766f">構造化プロフィールを返す</text>

    <rect x="350" y="565" width="310" height="210" rx="24" fill="#ffffff" stroke="#a9b7b1" stroke-width="3"/>
    <rect x="372" y="588" width="70" height="30" rx="15" fill="#eef1ef"/>
    <text x="407" y="609" text-anchor="middle" font-size="14" font-weight="700" fill="#5f7169">DATA</text>
    <text x="505" y="657" text-anchor="middle" font-size="29" font-weight="700" fill="#253c34">Firestore</text>
    <text x="505" y="694" text-anchor="middle" font-size="16" fill="#65766f">犬プロフィール・観測・判定履歴</text>
    <text x="505" y="721" text-anchor="middle" font-size="14" fill="#65766f">無料枠内で必要なデータを保存</text>
    <rect x="405" y="742" width="200" height="24" rx="12" fill="#eef1ef"/>
    <text x="505" y="759" text-anchor="middle" font-size="12" font-weight="700" fill="#5f7169">写真・動画は永続保存しない</text>

    <rect x="770" y="540" width="410" height="235" rx="24" fill="#ffffff" stroke="#8db29d" stroke-width="3"/>
    <rect x="792" y="563" width="94" height="30" rx="15" fill="#e4f0ea"/>
    <text x="839" y="584" text-anchor="middle" font-size="14" font-weight="700" fill="#35624f">LOGIC</text>
    <text x="975" y="626" text-anchor="middle" font-size="26" font-weight="700" fill="#253c34">相性計算・部屋最適化</text>
    <rect x="810" y="650" width="330" height="34" rx="17" fill="#f3f7f4" stroke="#d3e1da"/>
    <text x="975" y="673" text-anchor="middle" font-size="15" font-weight="700" fill="#40564d">1. 全ペアを100点で比較</text>
    <rect x="810" y="693" width="330" height="34" rx="17" fill="#f3f7f4" stroke="#d3e1da"/>
    <text x="975" y="716" text-anchor="middle" font-size="15" font-weight="700" fill="#40564d">2. 同室不可・体格差・定員を確認</text>
    <rect x="810" y="736" width="330" height="28" rx="14" fill="#f3f7f4" stroke="#d3e1da"/>
    <text x="975" y="756" text-anchor="middle" font-size="15" font-weight="700" fill="#40564d">3. 部屋割り案と理由を作成</text>

    <rect x="1280" y="565" width="270" height="210" rx="24" fill="#ffffff" stroke="#e2aa70" stroke-width="3"/>
    <rect x="1302" y="588" width="84" height="30" rx="15" fill="#fbecdc"/>
    <text x="1344" y="609" text-anchor="middle" font-size="14" font-weight="700" fill="#a16534">DECIDE</text>
    <text x="1415" y="657" text-anchor="middle" font-size="27" font-weight="700" fill="#253c34">施設スタッフ</text>
    <text x="1415" y="694" text-anchor="middle" font-size="16" fill="#65766f">提案と理由を確認</text>
    <rect x="1320" y="719" width="190" height="38" rx="19" fill="#dfece5"/>
    <text x="1415" y="745" text-anchor="middle" font-size="16" font-weight="700" fill="#35624f">最終判断は人</text>
  </g>
</svg>
